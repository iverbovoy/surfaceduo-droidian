# GeoClue: Night Light gets no location (#102).
#
# GNOME's Night Light (gsd-color, asking as "gnome-color-panel") asks for the
# location at every session start to know the sunset - even with Night Light
# off and its schedule fixed - and GeoClue answered it from the Wi-Fi networks
# around the phone, sent to api.beacondb.net. The port keeps the location for
# what asks for it on purpose (Maps, Firefox). The cost: Night Light's
# "sunset to sunrise" schedule has no sunset to go by; its fixed schedule,
# the port's default, is unaffected. Delete this file to give it back.
[gnome-color-panel]
allowed=false
system=true
users=

# Surface Duo: closing the device locks it, on battery or on power alike.
# The lid switch is the hinge's hall sensor. Suspend is turned off in the
# session as the device is set up today (sm.puri.phosh enable-suspend),
# so the fold locks; set these to `suspend` if that changes.
[Login]
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=lock

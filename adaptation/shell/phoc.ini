# phoc's configuration for the Surface Duo - Droidian's /usr/share/phosh/phoc.ini
# (phosh 0.49) with one change: the output scale. phosh-session takes this
# file whole when it exists, so it has to be the whole file. Droidian's generic
# scale of 3 makes the two panels 928x600 logical, a phone's worth of space in
# which GNOME Calculator does not fit; 2.5 is the density Android runs these
# panels at (400 dpi) and gives 1113x720. The shell's CSS and dock follow the
# scale (sfduo-shell-css, and the dock asks the compositor); after changing
# it here run `sudo sfduo-shell-css` and restart the shell.
#[core]
#xwayland=false

#[output:DSI-1]
#scale = 2

[output:HWCOMPOSER-1]
scale = 2.5

[output:Virtual-1]
# For the x86 VM using QXL to get a phone like geometry
modeline = 87.25  720 776 848 976  1440 1443 1453 1493 -hsync +vsync
mode = 720x1440
scale = 2

[output:X11-1]
mode = 360x720
#rotate = 90
#scale = 1

[output:WL-1]
mode = 360x720
#rotate = 90
#scale = 1

[output:HEADLESS-1]
mode = 720x1440
#rotate = 90
scale = 2

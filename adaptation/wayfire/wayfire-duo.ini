# wayfire session for Surface Duo 1 (2026-07-12)
# Output 2784x1800 @ scale 2 -> logical 1392x900.
# Panels: left [0,675], HINGE [675,717] (84 dead px), right [717,1392].
# sfduo-tiler keeps every window on a single panel.
[core]
plugins = ipc ipc-rules autostart command place move resize grid vswitch wsets alpha animate decoration foreign-toplevel
xwayland = false

[output:HWCOMPOSER-1]
mode = 2784x1800@60
scale = 2

[autostart]
bg = swaybg -i /usr/share/sfduo/wallpaper.png -m fill
tiler = /usr/local/sbin/sfduo-tiler
kbd = /usr/local/bin/sfduo-osk
bar = waybar


[place]
mode = center

# wayfire session for Surface Duo 1 (2026-07-12)
# Output 2784x1800 @ scale 2 -> logical 1392x900.
# Panels: left [0,675], HINGE [675,717] (84 dead px), right [717,1392].
# sfduo-tiler keeps every window on a single panel.
[core]
plugins = ipc ipc-rules autostart command place move resize grid vswitch wsets alpha animate decoration
xwayland = false

[output:HWCOMPOSER-1]
mode = 2784x1800@60
scale = 2

[autostart]
term_left = foot --app-id=term-left
term_right = foot --app-id=term-right
tiler = /usr/local/sbin/sfduo-tiler
kbd = sh -c "rm -f /tmp/sfduo-kbd-visible; exec /usr/local/bin/wvkbd-mobintl -L 260 --hidden"
bar = waybar


[place]
mode = center
